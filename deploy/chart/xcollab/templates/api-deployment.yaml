apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xcollab.fullname" . }}-api
  labels:
    {{- include "xcollab.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "xcollab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "xcollab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Force a rollout when the non-secret env changes.
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.api.hostAliases }}
      # Air-gap DNS workaround: in-cluster resolution of the public host may
      # point at an edge that does not forward this service, which breaks the
      # Keycloak JWKS fetch (every token then 401s). Pin the host to the
      # ingressgateway ClusterIP so issuer URL and JWKS URL stay identical to
      # what the tokens carry.
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "xcollab.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ required "api.image.tag is required (set by bin/promote.sh)" .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "xcollab.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "xcollab.fullname" . }}-api-env
            - secretRef:
                # Pre-created out of band — see deploy/README.md, section
                # "In-cluster prerequisites". Never rendered by this chart.
                name: {{ .Values.api.existingSecret }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem: node needs a writable /tmp at most.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
