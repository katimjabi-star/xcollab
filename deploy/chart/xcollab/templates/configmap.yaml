# Non-secret api env. Secret keys (DATABASE_URL, APP_DATABASE_URL,
# KEYCLOAK_SVC_CLIENT_ID, KEYCLOAK_SVC_CLIENT_SECRET, MINIO_ACCESS_KEY,
# MINIO_SECRET_KEY) come from the pre-created Secret named by
# .Values.api.existingSecret — never from this chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xcollab.fullname" . }}-api-env
  labels:
    {{- include "xcollab.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  PORT: {{ .Values.api.port | quote }}
  KEYCLOAK_ISSUER: {{ .Values.backends.keycloak.issuer | quote }}
  {{- with .Values.api.env.keycloakAudience }}
  KEYCLOAK_AUDIENCE: {{ . | quote }}
  {{- end }}
  MINIO_ENDPOINT: {{ .Values.backends.minio.host | quote }}
  MINIO_PORT: {{ .Values.backends.minio.port | quote }}
  MINIO_USE_SSL: {{ .Values.backends.minio.useSSL | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.api.env.corsAllowedOrigins | quote }}
  {{- with .Values.api.env.x4authMode }}
  # "mock" fakes the Katim-device approval (POC); live mode instead takes
  # X4AUTH_BASE_URL/CLIENT_ID/CLIENT_SECRET from the api Secret.
  X4AUTH_MODE: {{ . | quote }}
  {{- end }}
  {{- if .Values.backends.ollama.enabled }}
  OLLAMA_BASE_URL: {{ printf "http://%s:%v" .Values.backends.ollama.host .Values.backends.ollama.port | quote }}
  OLLAMA_MODEL: {{ .Values.backends.ollama.model | quote }}
  {{- end }}
