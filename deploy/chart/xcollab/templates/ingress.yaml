{{- if .Values.ingress.enabled }}
# Plain Ingress alternative to the istio VirtualService (off by default).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "xcollab.fullname" . }}
  labels:
    {{- include "xcollab.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.api.exposeViaGateway }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "xcollab.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "xcollab.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
