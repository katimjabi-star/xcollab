# xcollab dev-infra: Keycloak (DEV POSTURE — same role as securesign's
# dev-mode Vault pod). k2 has NO shared Keycloak (the incumbent IdP is
# X4Auth), so xcollab ships its own until/unless it integrates X4Auth.
#
# Dev-posture caveats (accepted for xcollab-dev, NOT for s/prod):
#   - start-dev + embedded H2 on an emptyDir: realm state DIES with the pod.
#     Re-run keycloak/bootstrap-dev.sh (KEYCLOAK_URL=<pod>) after a restart,
#     or move KC_DB to the xcollab Postgres before anything user-facing.
#   - Admin bootstrap credentials come from the out-of-band Secret
#     `xcollab-keycloak-admin` (keys: KC_BOOTSTRAP_ADMIN_USERNAME,
#     KC_BOOTSTRAP_ADMIN_PASSWORD) — never a literal here.
#
# Path layout: served under /auth (KC_HTTP_RELATIVE_PATH) behind the shared
# platform-gateway via the chart's VirtualService (istio.virtualService
# .routeKeycloak=true). KC_HOSTNAME must equal the public issuer base and
# match both backends.keycloak.issuer in values and the
# NEXT_PUBLIC_KEYCLOAK_ISSUER baked into the web image.
#
# Image: carry as a tar (Mac: `docker pull --platform linux/amd64
# quay.io/keycloak/keycloak:26.0 && docker save ...`), push as
# 172.26.34.205:5000/infra/keycloak:26.0 from k2-registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xcollab-keycloak
  labels:
    app.kubernetes.io/name: xcollab-keycloak
    app.kubernetes.io/part-of: xcollab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xcollab-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xcollab-keycloak
        app.kubernetes.io/part-of: xcollab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: 172.26.34.205:5000/infra/keycloak:26.0
          args: ["start-dev"]
          env:
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            # Public base URL — TLS terminates at the platform gateway.
            - name: KC_HOSTNAME
              value: https://service8.nexedge.ae/auth
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
          envFrom:
            - secretRef:
                name: xcollab-keycloak-admin
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /auth/realms/master
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: xcollab-keycloak
  labels:
    app.kubernetes.io/name: xcollab-keycloak
    app.kubernetes.io/part-of: xcollab
spec:
  selector:
    app.kubernetes.io/name: xcollab-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
