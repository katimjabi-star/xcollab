# xcollab — prod overrides. In k2-gitops: values/xcollab/prod.yaml.
#
# Namespace: xcollab-prod (dedicated — recommended), created with the label
#   pod-security.kubernetes.io/enforce: restricted
# NEVER add that label to the shared tasdiq-prod namespace; fallback
# deploys there make no namespace-level change (pod specs are
# restricted-compliant on their own).
#
# Deploy discipline: prod promotions only on explicit instruction.

api:
  replicas: 2
  image:
    # Edited by bin/promote.sh (xcollab-api -> .api.image.tag).
    tag: v0.1-sovereign-0000000
  env:
    corsAllowedOrigins: "https://xcollab.xedge-internal.corp"

web:
  replicas: 2
  image:
    # Edited by bin/promote.sh (xcollab-web -> .web.image.tag).
    tag: v0.1-sovereign-0000000

backends:
  postgres:
    host: postgres.tasdiq-prod.svc.cluster.local
    port: 5432
  minio:
    host: minio.tasdiq-prod.svc.cluster.local
    port: 9000
    useSSL: "false"
  keycloak:
    host: keycloak.tasdiq-prod.svc.cluster.local
    port: 8080
    issuer: https://keycloak.xedge-internal.corp/realms/xcollab
  ollama:
    enabled: false
    host: ollama.tasdiq-prod.svc.cluster.local
    port: 11434
    model: ""

istio:
  virtualService:
    enabled: true
    host: xcollab.xedge-internal.corp
    gateways:
      - istio-system/main-gateway

quota:
  enabled: false   # enable only in the dedicated xcollab-prod namespace
