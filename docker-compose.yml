services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: xcollab
      POSTGRES_PASSWORD: xcollab_dev_only
      POSTGRES_DB: xcollab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xcollab"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: xcollab
      MINIO_ROOT_PASSWORD: xcollab_dev_only
    ports:
      - "9000:9000"
      # Some corporate endpoint agents (Zscaler ztunnel) hijack loopback :9000;
      # 19000 is an additive alternate for the same S3 API (use MINIO_PORT=19000).
      - "19000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/themes/xcollab:/opt/keycloak/themes/xcollab:ro
      - keycloakdata:/opt/keycloak/data

volumes:
  pgdata:
  miniodata:
  keycloakdata:
